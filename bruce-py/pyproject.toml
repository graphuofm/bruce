[build-system]
requires      = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "bruce"
version = "0.1.0"
description = "Bruce: a unified algebra of relational databases and Transformer attention (Python bindings)"
authors = [{name = "Jiacheng Ding", email = "jding2@memphis.edu"}]
license = {text = "Apache-2.0"}
readme = "../README.md"
requires-python = ">=3.9"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
keywords = ["attention", "database", "semiring", "join", "transformer", "retrieval"]
dependencies = [
  "numpy>=1.24",
]



[project.optional-dependencies]
test = ["pytest>=7", "hypothesis>=6"]
bench = ["pytest-benchmark"]

[project.urls]
Repository = "https://github.com/jding/bruce"
Changelog = "https://github.com/jding/bruce/blob/main/CHANGELOG.md"

[tool.maturin]
module-name = "bruce._bruce"
exclude = ["**/__pycache__/**"]
features = ["pyo3/extension-module"]
manifest-path = "Cargo.toml"
python-source = "python"
