[package]
name = "softavg-ablation-sqlite"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Softmax-ladder ablation for SQLite: softavg_s3 (plain xInverse, no certificate) and softavg_s2 (no removal: recompute the frame)"

[lib]
crate-type = ["cdylib"]

[dependencies]
softagg-core = { path = "../../../engines/core" }
ladder-core = { path = "../ladder_core" }
libsqlite3-sys = { version = "0.37", features = ["loadable_extension"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# standalone: not part of any parent workspace
[workspace]
