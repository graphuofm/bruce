[package]
name = "ladder-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Softmax-ladder ablation: rung S3 (online softmax with plain removal, no certificate) over softagg-core's ScalarAcc"

[lib]
crate-type = ["rlib"]

[dependencies]
softagg-core = { path = "../../../engines/core" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# standalone: not part of any parent workspace
[workspace]
