[package]
name = "ladder-replay"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Replays PostgreSQL's moving-aggregate and softavg_ivm call sequences over softagg-core (S2, S4) and ladder-core (S3), outside the server"

[[bin]]
name = "ladder_replay"
path = "src/main.rs"

[dependencies]
softagg-core = { path = "../../../engines/core" }
ladder-core = { path = "../ladder_core" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# standalone: not part of any parent workspace
[workspace]
