[package]
name = "softagg-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The max-shifted soft-average state shared by the PostgreSQL, DuckDB, SQLite and ClickHouse extensions"

[lib]
crate-type = ["rlib"]

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# standalone: not part of any parent workspace
[workspace]
