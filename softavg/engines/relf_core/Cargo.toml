[package]
name = "relf-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "relF(value, score, d) = AVG(value) over rows with score >= MAX(score) - d: the exact one-pass states (insert-only band, FIFO-window band, maintenance band with headroom). Baseline for paper_icde/experiments/anchored; NOT part of softagg-core."

[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# standalone: not part of any parent workspace
[workspace]
