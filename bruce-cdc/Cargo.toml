[package]
name = "bruce-cdc"
version = "0.1.0"
edition = "2021"
description = "CDC maintenance plane: PostgreSQL logical replication -> bruce maintained state"
license = "MIT"

# Standalone crate: NOT a member of the parent workspace.
[workspace]

[dependencies]
bruce-query = { path = "../bruce-query" }
ndarray = "0.16"
thiserror = "2"

[dev-dependencies]
# Control-plane SQL only (seed / ground truth). The replication
# stream itself is spoken by src/protocol.rs: released rust-postgres
# has no replication support.
postgres = "0.19"
